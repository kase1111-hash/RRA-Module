# Mypy Configuration for RRA Module
#
# Incrementally enforcing type safety while maintaining compatibility.
# M-001 fix: Enable stricter type checking progressively.

[mypy]
# Target Python version
python_version = 3.9

# Base settings
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Allow missing imports for third-party packages
ignore_missing_imports = True

# Strictness settings (enabled progressively)
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# Stricter modules - fully typed
[mypy-rra.exceptions]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.config.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.storage.session_store]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.oracles.price_oracle]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.transaction.safeguards]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.contracts.license_nft]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.agents.negotiator]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.agents.intent_parser]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-rra.contracts.gas_estimator]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Test files - more lenient
[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = False
