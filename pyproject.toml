[build-system]
requires = ["setuptools>=82.0.1", "wheel"]  # >=78.1.1 fixes CVE-2024-6345, CVE-2025-47273, CVE-2025-48876
build-backend = "setuptools.build_meta"

[project]
name = "rra-module"
version = "1.0.1-beta"
description = "Revenant Repo Agent Module - Transform dormant repos into autonomous licensing agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "FSL-1.1-ALv2"}
authors = [
    {name = "RRA Contributors"}
]
keywords = ["blockchain", "ai", "licensing", "github", "automation", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0.3",
    "gitpython>=3.1.46",
    "requests>=2.33.1",
    "click>=8.3.2",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "pydantic>=2.13.0",
    "web3>=7.15.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "eth-abi>=5.2.0",
    "eth-utils>=6.0.0",
    # Security - pinned to fix CVEs
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "black>=26.3.1",
    "ruff>=0.15.10",
    "flake8>=7.3.0",
    "mypy>=1.20.1",
    # Type stubs
    "types-PyYAML>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
    # Security - ensure pip is up to date
    "pip>=26.0.1",
]

# NatLangChain ecosystem integration (optional)
# Install with: pip install rra-module[natlangchain]
natlangchain = [
    # These will be actual packages once the ecosystem repos are published
    # For now, these are placeholder references
    # "natlangchain-common>=0.1.0",
    # "natlangchain-agent-os>=0.1.0",
    # "natlangchain-memory-vault>=0.1.0",
    # "natlangchain-value-ledger>=0.1.0",
    # "natlangchain-mediator-node>=0.1.0",
    # "natlangchain-intent-log>=0.1.0",
    # "natlangchain-synth-mind>=0.1.0",
]

# Crypto performance optimizations (recommended)
# Install with: pip install rra-module[crypto]
crypto = [
    "gmpy2>=2.3.0",   # 77x faster modular inverse for Pedersen commitments
    "py-ecc>=8.0.0",  # Optimized BN254 curve operations (fallback)
]

# Full installation with all extras
all = [
    "rra-module[dev,natlangchain,crypto]",
]

[project.scripts]
rra = "rra.cli.main:cli"

[project.urls]
Homepage = "https://github.com/kase1111-hash/RRA-Module"
Repository = "https://github.com/kase1111-hash/RRA-Module"
Issues = "https://github.com/kase1111-hash/RRA-Module/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Strict mode for core modules
[[tool.mypy.overrides]]
module = ["rra.exceptions", "rra.contracts.*", "rra.storage.*"]
warn_return_any = true
strict_optional = true

# Lenient for third-party integration modules
[[tool.mypy.overrides]]
module = ["rra.integrations.*", "rra.integration.*"]
ignore_errors = true

[tool.ruff]
# Match Black's line length
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Allow module-level imports not at top of file (E402)
# Many modules have logger = logging.getLogger(__name__) before imports
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # web3 v7+ still imports websockets.legacy internally; suppress until fully removed
    # Tracking: https://github.com/ethereum/web3.py/issues/2705
    "ignore::DeprecationWarning:websockets.legacy",
]
