name: CI

on:
  push:
    branches: [ main, master, develop, "claude/*" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Check formatting with Black
        run: |
          black --check --diff src/ tests/

      - name: Lint with Flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install types-PyYAML types-requests

      - name: Run mypy (strict modules)
        run: |
          # Strict type checking for core modules - these MUST pass
          echo "Checking strictly-typed modules..."
          mypy src/rra/exceptions.py \
               src/rra/config/ \
               src/rra/storage/session_store.py \
               src/rra/oracles/price_oracle.py \
               src/rra/transaction/safeguards.py \
               src/rra/contracts/license_nft.py \
               src/rra/contracts/gas_estimator.py \
               src/rra/agents/negotiator.py \
               src/rra/agents/intent_parser.py \
               --config-file mypy.ini
          echo "Strict modules type check passed!"

      - name: Run mypy (full codebase - warnings)
        run: |
          # Full codebase check - informational only for remaining modules
          echo "Running full codebase type check (warnings only for non-strict modules)..."
          mypy src/rra --config-file mypy.ini 2>&1 | tail -20 || true
          echo "Full type check completed"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x --timeout=300

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Run Bandit security scan
        run: |
          # Fail on HIGH and CRITICAL severity findings
          bandit -r src/rra -ll --skip B101 -f txt
          # B101 = assert statements (used in tests)

      - name: Audit Python dependencies
        run: |
          pip-audit --strict --desc on 2>&1 | head -100

      - name: Check for secrets in code
        run: |
          # Fail if real private keys or API keys are found in source
          ! grep -rn 'PRIVATE_KEY\s*=\s*"0x[a-fA-F0-9]\{64\}"' src/ scripts/ || \
            (echo "ERROR: Hardcoded private key found!" && exit 1)
          echo "No hardcoded secrets detected"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Summary job that other workflows can depend on
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "All CI checks passed"
